name: Daily news

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node fetch-news.js
      - name: Commit news.json
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet && echo "Notun kichu nei" && exit 0
          git commit -m "Daily news update"
          git push
